$kind: http-request
url: "{{baseUrl}}/students"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON array', function () { pm.expect(pm.response.json()).to.be.an('array'); });
order: 1000
