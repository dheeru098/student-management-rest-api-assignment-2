$kind: http-request
url: "{{baseUrl}}/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"name":"Neha","course":"BCA"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () { pm.response.to.have.status(201); });
      pm.test('Created student has id', function () { pm.expect(pm.response.json()).to.have.property('id'); });
order: 3000
